# Vendored from the dynamo-tokenizers 4.1.2 crate published by
# https://github.com/ai-dynamo/frontend-crates. Upstream license is
# Apache-2.0; the local patch adds kimi_k31 dispatch on the existing
# KIMI_PATTERN plus a Unicode/special-token regression test in
# src/tiktoken.rs. Keep the 4.1.2 version so the [patch.crates-io]
# redirect (root Cargo.toml) and registry resolutions stay
# interchangeable.

[package]
name = "dynamo-tokenizers"
description = "Standalone HuggingFace, tiktoken, fastokens, and Baseten tokenizer implementations for LLM inference serving."
version = "4.1.2"
edition = "2024"
license = "Apache-2.0"
authors = ["NVIDIA Inc. <sw-dl-dynamo@nvidia.com>"]
repository = "https://github.com/ai-dynamo/frontend-crates.git"
readme = "README.md"
keywords = ["llm", "tokenizer", "huggingface", "tiktoken", "inference"]

[lib]
name = "dynamo_tokenizers"
path = "src/lib.rs"

[dependencies]
aho-corasick = "1"
anyhow.workspace = true
base64 = "0.22"
basetenkenizer = { version = "0.2.8", default-features = false }
blake3.workspace = true
fastokens = "0.3"
moka = { workspace = true, features = ["sync"] }
rayon = "1"
rustc-hash = "1.1"
serde = { workspace = true, features = ["derive", "rc"] }
serde_json.workspace = true
strum.workspace = true
tiktoken-rs = { version = "0.9", default-features = false }
tokenizers = { version = "0.23.2", features = [
    "onig",
    "esaxx_fast",
    "rustls-tls",
], default-features = false }
tracing.workspace = true

[dev-dependencies]
tempfile = "3"
