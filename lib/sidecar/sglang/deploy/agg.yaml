#
# Replace <tag> with a supported SGLang image tag before deploying.
#
# EXPERIMENTAL. Aggregated SGLang deployment using the Rust sidecar.
#
# Worker pod = two containers:
#   - main: Dynamo worker (dynamo-sglang-sidecar), no GPU; talks to the engine
#     over gRPC on 127.0.0.1 and auto-discovers the model/role (no --model-path).
#     Must be named "main" (operator injects env + probes).
#   - sglang-engine: stock SGLang image, holds the GPU, runs its native gRPC
#     server as a native sidecar (see initContainers).
#
# The engine's gRPC has no auth/TLS; safe only because it stays on loopback.
#
# SGLang can also load the sidecar in-process (`--sidecar dingo.sglang.sidecar`,
# see README); this example uses the standalone image for consistency with the
# TensorRT-LLM and vLLM sidecars.

apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: sglang-sidecar-agg
spec:
  components:
  - name: Frontend
    type: frontend
    replicas: 1
    podTemplate:
      spec:
        containers:
        - name: main
          image: <your-registry>/dynamo-frontend:1.6.0
  - name: SGLangWorker
    type: worker
    replicas: 1
    podTemplate:
      spec:
        initContainers:
        - name: runtime
          image: <your-registry>/dynamo-sidecar:1.6.0
          command:
          - dynamo-sglang-sidecar
          args:
          - --grpc-endpoint
          - 127.0.0.1:30001
          restartPolicy: Always
          envFrom:
          - secretRef:
              name: hf-token-secret
              optional: true
        containers:
        # Engine must be named `main`; it owns the GPU and model lifecycle.
        - name: main
          image: lmsysorg/sglang:<tag>
          # All probes pass only for HealthCheckResponse.healthy=true;
          # its raw protobuf encoding is 0x08 0x01.
          startupProbe:
            exec:
              command:
              - python3
              - -c
              - import grpc; r=grpc.insecure_channel('127.0.0.1:30001').unary_unary('/sglang.runtime.v1.SglangService/HealthCheck')(b'', timeout=3); raise SystemExit(0 if r == b'\x08\x01' else 1)
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 180
          readinessProbe:
            exec:
              command:
              - python3
              - -c
              - import grpc; r=grpc.insecure_channel('127.0.0.1:30001').unary_unary('/sglang.runtime.v1.SglangService/HealthCheck')(b'', timeout=3); raise SystemExit(0 if r == b'\x08\x01' else 1)
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
              - python3
              - -c
              # HealthCheckResponse has one bool field: healthy=true encodes as
              # 0x08 0x01. Fail when the RPC succeeds but reports unhealthy.
              - import grpc; r=grpc.insecure_channel('127.0.0.1:30001').unary_unary('/sglang.runtime.v1.SglangService/HealthCheck')(b'', timeout=3); raise SystemExit(0 if r == b'\x08\x01' else 1)
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          envFrom:
          - secretRef:
              name: hf-token-secret
              optional: true
          resources:
            limits:
              nvidia.com/gpu: "1"
            requests:
              ephemeral-storage: 2Gi
          command:
          - python3
          - -m
          - sglang.launch_server
          args:
          - --model-path
          - Qwen/Qwen3-0.6B
          - --host
          - 127.0.0.1
          - --port
          - "30000"
          - --grpc-port
          - "30001"
          - --incremental-streaming-output
  backendFramework: sglang
