<title id="title">Video Gateway 与 Omni Worker 多模型高可用部署架构</title>
<desc id="desc">入口负载均衡连接多个主动服务的 Gateway 副本，按 model 路由至独立的 H3 FL2VA、H3 Ref2VA 和可选 H3 加 SeedVR2 超分 Worker 池。Gateway 和 Worker 共享 etcd 协调与制品存储，并连接监控系统。新模型家族需要适配器扩展。</desc>
<defs><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="#3266c4"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="#138775"/></marker><marker id="purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="#8a63b8"/></marker></defs>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","DejaVu Sans",sans-serif;fill:#20304b}.title{font-size:32px;font-weight:700}.section{font-size:22px;font-weight:700}.label{font-size:19px;font-weight:600}.body{font-size:17px}.small{font-size:15px;fill:#53647e}</style>
