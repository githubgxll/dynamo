<text x="70" y="947" class="body" text-anchor="start">任务 / 队列 / 幂等 / owner / slot / 重试额度</text>
<text x="70" y="976" class="small" text-anchor="start">Runtime 注册发现（逻辑职责与任务存储区分）</text>
<text x="70" y="1004" class="small" text-anchor="start">HA 部署示意：3 成员，保有法定多数</text>
<rect x="588" y="883" width="502" height="140" rx="14" fill="#e8f6f1" stroke="#acd7c8" stroke-width="1.5"/>
<text x="610" y="916" class="section" text-anchor="start">共享制品文件系统</text>
<text x="610" y="947" class="body" text-anchor="start">上传素材 · request / manifest · Worker status</text>
<text x="610" y="976" class="small" text-anchor="start">attempt MP4 · durable handoff 对应结果</text>
<text x="610" y="1004" class="small" text-anchor="start">所有副本挂载同一根目录；文件系统自身需高可用</text>
<rect x="1128" y="883" width="502" height="140" rx="14" fill="#fff" stroke="#d7e0ed" stroke-width="1.5"/>
<text x="1150" y="916" class="section" text-anchor="start">Prometheus → Grafana</text>
<text x="1150" y="947" class="body" text-anchor="start">采集 Gateway 与 Worker 指标</text>
<text x="1150" y="976" class="small" text-anchor="start">排队 / GPU 执行 / 预取 / 后处理 / 容量</text>
<text x="1150" y="1004" class="small" text-anchor="start">可选性能采集器 → PostgreSQL（逐任务记录）</text>
<rect x="48" y="1050" width="1582" height="72" rx="14" fill="#fff" stroke="#d7e0ed" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="70" y="1080" class="label" text-anchor="start">扩展边界</text>
<text x="210" y="1080" class="body" text-anchor="start">当前 Gateway adapter 支持 MiniMax-H3；新增模型家族需实现并验证 adapter 与结果契约。</text>
<text x="210" y="1106" class="small" text-anchor="start">模型池可以独立扩容；新增 Gateway 副本不会自动增加 GPU 执行容量。</text>
<path d="M70 1160 H130" fill="none" stroke="#3266c4" stroke-width="2.5" marker-end="url(#blue)"/>
<text x="145" y="1166" class="small" text-anchor="start">请求 / 调度 RPC</text>
<path d="M355 1160 H415" fill="none" stroke="#138775" stroke-width="2.5" marker-end="url(#green)" marker-start="url(#green)"/>
<text x="430" y="1166" class="small" text-anchor="start">共享文件读写</text>
<path d="M650 1160 H710" fill="none" stroke="#8a63b8" stroke-width="2.5" marker-end="url(#purple)" marker-start="url(#purple)" stroke-dasharray="8 5"/>
<text x="725" y="1166" class="small" text-anchor="start">持久化协调</text>
<text x="975" y="1166" class="small" text-anchor="start">注册发现与监控连线按层汇总说明，避免交叉遮挡</text>
<text x="48" y="1200" class="small" text-anchor="start">部署示意，非当前集群实测拓扑。Worker 失联可按策略重试；GPU 中间计算不承诺无损迁移。</text>
