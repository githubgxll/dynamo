<text x="645" y="150" class="label" text-anchor="middle">Load Balancer / Ingress</text>
<text x="645" y="179" class="small" text-anchor="middle">统一 API 入口 · 就绪探测 · 上层认证</text>
<path d="M338 158 H440" fill="none" stroke="#3266c4" stroke-width="2.5" marker-end="url(#blue)" marker-start="url(#blue)"/>
<text x="389" y="145" class="small" text-anchor="middle">HTTP</text>
