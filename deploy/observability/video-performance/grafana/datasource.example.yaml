# Select this PostgreSQL datasource directly in the performance dashboards.
apiVersion: 1
datasources:
  - name: video-performance-example-region
    uid: video-performance-example-region
    type: grafana-postgresql-datasource
    access: proxy
    url: ${VIDEO_PERFORMANCE_HOST}
    user: grafanareader
    jsonData:
      database: performance
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: ${VIDEO_PERFORMANCE_READ_PASSWORD}
