name: DingoRouter CI Pipeline

# 自动触发：当代码合并（push）到 DingoRouter-base 分支时构建镜像。
# 也可手动触发以便调试。
on:
  push:
    branches:
      - DingoRouter-base
  workflow_dispatch:
    inputs:
      build_vllm:
        description: 'Build vllm-runtime image'
        type: boolean
        default: true
      build_sglang:
        description: 'Build sglang-runtime image'
        type: boolean
        default: true

permissions:
  contents: read

env:
  BUILDER_NAME: b-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  # ============================================================================
  # INIT
  # 导出 builder 名 & 规范化分支名（DingoRouter-base → dingorouter-base）。
  # Docker tag 字符集为 [a-zA-Z0-9._-]，原始分支名合法但统一小写更易管理。
  # ============================================================================
  init:
    name: Config
    runs-on: ubuntu-latest
    outputs:
      builder_name: ${{ steps.export.outputs.builder_name }}
      sanitized_ref_name: ${{ steps.sanitize.outputs.sanitized_ref_name }}
      run_vllm: ${{ steps.flags.outputs.run_vllm }}
      run_sglang: ${{ steps.flags.outputs.run_sglang }}
    steps:
      - id: export
        run: echo "builder_name=${{ env.BUILDER_NAME }}" >> "$GITHUB_OUTPUT"
      - id: sanitize
        shell: bash
        run: |
          sanitized=$(echo "${{ github.ref_name }}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-zA-Z0-9._-]/-/g' \
            | sed 's/^-//;s/-$//' \
            | cut -c1-128)
          echo "sanitized_ref_name=${sanitized}" >> "$GITHUB_OUTPUT"
      - id: flags
        shell: bash
        env:
          BV: ${{ github.event.inputs.build_vllm == 'true' || github.event_name == 'push' }}
          BS: ${{ github.event.inputs.build_sglang == 'true' || github.event_name == 'push' }}
        run: |
          echo "run_vllm=${BV}"   >> "$GITHUB_OUTPUT"
          echo "run_sglang=${BS}" >> "$GITHUB_OUTPUT"

  # ============================================================================
  # BUILD JOBS
  # 通过 shared-build-image.yml 复用所有构建逻辑（render.py、BuildKit、
  # ECR push、compliance extract 等）。extra_tags 用分支名前缀作为浮动 tag，
  # 模仿 main-* 模式但区分 DingoRouter 分支产物。
  #
  # 不可变 SHA tag（<sha>-vllm-runtime）由 shared-build-image.yml 自动产生，
  # extra_tags 额外推送两个浮动 tag：
  #   - dingorouter-base-vllm-runtime            （mutable latest）
  #   - dingorouter-base-vllm-runtime-<sha>      （immutable pin）
  # ============================================================================

  vllm-build:
    name: vllm-runtime
    needs: [init]
    if: needs.init.outputs.run_vllm == 'true'
    uses: ./.github/workflows/shared-build-image.yml
    with:
      framework: vllm
      target: runtime
      cuda_version: '["13.0"]'
      platform: 'linux/amd64,linux/arm64'
      builder_name: ${{ needs.init.outputs.builder_name }}
      inline_compliance: true
      build_timeout_minutes: 120
      extra_tags: |
        ${{ needs.init.outputs.sanitized_ref_name }}-vllm-runtime
        ${{ needs.init.outputs.sanitized_ref_name }}-vllm-runtime-${{ github.sha }}
      archive_sources: false
    secrets: inherit

  sglang-build:
    name: sglang-runtime
    needs: [init]
    if: needs.init.outputs.run_sglang == 'true'
    uses: ./.github/workflows/shared-build-image.yml
    with:
      framework: sglang
      target: runtime
      cuda_version: '["13.0"]'
      platform: 'linux/amd64,linux/arm64'
      builder_name: ${{ needs.init.outputs.builder_name }}
      inline_compliance: true
      build_timeout_minutes: 120
      extra_tags: |
        ${{ needs.init.outputs.sanitized_ref_name }}-sglang-runtime
        ${{ needs.init.outputs.sanitized_ref_name }}-sglang-runtime-${{ github.sha }}
      archive_sources: false
    secrets: inherit

  # ============================================================================
  # CLEANUP
  # shared-build-image.yml 内部不会清理 caller 创建的 builder，这里保证
  # 无论构建成功与否都回收 K8s BuildKit builder，避免资源泄漏。
  # ============================================================================
  clean-k8s-builder:
    name: Clean K8s builder
    runs-on: prod-default-small-v2
    if: always()
    needs: [init, vllm-build, sglang-build]
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Create K8s builders (skip bootstrap)
        uses: ./.github/actions/bootstrap-buildkit
        continue-on-error: true
        with:
          builder_name: ${{ needs.init.outputs.builder_name }}
          buildkit_worker_addresses: ''
          skip_bootstrap: true
      - name: Builder cleanup
        shell: bash
        run: |
          docker buildx rm ${{ needs.init.outputs.builder_name }} || true
