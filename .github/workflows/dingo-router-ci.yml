name: Dingo runtime images

on:
  push:
    branches:
      - DingoRouter-base
  workflow_dispatch:
    inputs:
      frameworks:
        description: Images to build (configured uses dingo-images.json)
        type: choice
        options:
          - configured
          - dynamo
          - vllm
          - sglang
          - all
        default: configured

permissions:
  contents: read

# Preserve an image for every pushed commit while preventing two workflow runs
# from competing for the same local Docker daemon.
concurrency:
  group: dingo-runtime-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare image matrix
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    outputs:
      has_images: ${{ steps.matrix.outputs.has_images }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Read and validate image configuration
        id: matrix
        env:
          FRAMEWORK_SELECTION: ${{ inputs.frameworks || 'configured' }}
        run: |
          python3 .github/scripts/prepare_dingo_image_matrix.py \
            --config .github/dingo-images.json \
            --github-sha "${GITHUB_SHA}" \
            --selection "${FRAMEWORK_SELECTION}" \
            --github-output "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.framework }} runtime
    needs: prepare
    if: needs.prepare.outputs.has_images == 'true'
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Check self-hosted runner prerequisites
        shell: bash
        run: |
          docker version
          docker buildx version
          python3 -c "import jinja2, yaml"

      - name: Render ${{ matrix.framework }} runtime Dockerfile
        shell: bash
        env:
          CUDA_VERSION: ${{ matrix.cuda_version }}
          FRAMEWORK: ${{ matrix.framework }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          python3 container/render.py \
            --framework "${FRAMEWORK}" \
            --target runtime \
            --cuda-version "${CUDA_VERSION}" \
            --platform "${PLATFORM}"

      - name: Log in to the private registry
        uses: docker/login-action@v4
        with:
          registry: ${{ matrix.registry }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          name: dingo-${{ matrix.framework }}-builder
          driver: docker-container
          keep-state: ${{ matrix.keep_buildkit_state }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          target: ${{ matrix.docker_target }}
          push: true
          tags: ${{ matrix.image }}
          provenance: false
          sbom: false

      - name: Publish job summary
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          echo "### Published image" >> "${GITHUB_STEP_SUMMARY}"
          echo "\`${IMAGE}\`" >> "${GITHUB_STEP_SUMMARY}"
