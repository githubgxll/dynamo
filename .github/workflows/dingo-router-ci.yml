# SPDX-License-Identifier: Apache-2.0
name: Dingo H3 experimental image recipes
run-name: "${{ github.event_name == 'push' && (contains(github.event.head_commit.message, '[seedvr2-optimization]') && 'seedvr2-optimization' || contains(github.event.head_commit.message, '[sr-native]') && 'sr-native-seedvr2-and-flashvsr-plus' || contains(github.event.head_commit.message, '[h3-hsdp-offload]') && 'h3-hsdp-offload' || contains(github.event.head_commit.message, '[seedvr2-c14]') && 'seedvr2-c14' || 'omni-gateway-lite') || inputs.build_recipe }} | ${{ github.ref_name }} | ${{ github.sha }}"

on:
  push:
    branches: [Dingorouter-H3-vllm-omni-jirx]
  workflow_dispatch:
    inputs:
      build_recipe:
        description: 'Choose native SR reference images, successful-image repair, Omni/Gateway, or full rebuild'
        type: choice
        required: true
        default: omni-gateway-lite
        options: [seedvr2-optimization, sr-native, h3-hsdp-offload, seedvr2-c14, seedvr2-rmsnorm, omni-gateway-lite, full]

permissions:
  contents: read

concurrency:
  group: dingo-runtime-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  h3-experimental:
    # Full framework/native builds are now an explicit operator choice only.
    if: github.ref_name == 'Dingorouter-H3-vllm-omni-jirx' && github.event_name == 'workflow_dispatch' && inputs.build_recipe == 'full'
    runs-on: [self-hosted, linux, x64, dingo]
    timeout-minutes: 360
    env:
      # Public Python indexes follow the maintained gateway build; credentials remain secrets.
      # No host or Pod proxy is embedded here.
      PIP_INDEX_URL: https://pypi.org/simple
      UV_DEFAULT_INDEX: https://pypi.org/simple
    steps:
      - name: Checkout the dedicated H3 experimental branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate the source and four-adapter configuration
        id: profile
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker buildx version
          python3 -c 'import jinja2, yaml'
          python3 .github/scripts/h3_experimental_ci.py prepare \
            --github-output "${GITHUB_OUTPUT}" --directory .h3-experimental-evidence/ci

      - name: Log in to the existing Harbor repository
        uses: docker/login-action@v4
        with:
          registry: ${{ steps.profile.outputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Reuse the persistent group Docker builder
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - name: Verify environment files survive the Docker build context
        shell: bash
        run: |
          set -euo pipefail
          context_export="$(mktemp -d "${RUNNER_TEMP}/h3-environment-context.XXXXXX")"
          trap 'rm -rf -- "${context_export}"' EXIT
          docker buildx build --file - --progress=plain \
            --provenance=false --sbom=false \
            --output "type=local,dest=${context_export}" . <<'DOCKERFILE'
          FROM scratch
          COPY container/h3-experimental/environment/ /environment/
          DOCKERFILE
          python3 .github/scripts/h3_experimental_ci.py check-context \
            --directory "${context_export}" \
            --report .h3-experimental-evidence/ci/environment-context.json

      - name: Expose job-scoped sccache credentials as BuildKit secrets
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '')
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '')

      - name: Check the gateway-input reusable native builder
        id: builder
        shell: bash
        env:
          BUILDER_IMAGE: ${{ steps.profile.outputs.builder_image }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "${BUILDER_IMAGE}" > .h3-experimental-evidence/ci/builder-inspect.txt 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "Reusing ${BUILDER_IMAGE}"
          elif grep -Eiq 'manifest unknown|no such manifest|not found' .h3-experimental-evidence/ci/builder-inspect.txt; then
            echo "exists=false" >> "${GITHUB_OUTPUT}"
            echo "Current gateway native inputs require a new reusable builder: ${BUILDER_IMAGE}"
          else
            cat .h3-experimental-evidence/ci/builder-inspect.txt
            echo 'Builder inspection failed for connectivity or authorization; not treating that as a missing image.' >&2
            exit 1
          fi

      - name: Render the first-build Dockerfile from reviewed gateway templates
        if: steps.builder.outputs.exists != 'true'
        run: python3 container/render.py --framework vllm --target runtime --cuda-version 13.0 --platform linux/amd64

      - name: Build and publish the input-fingerprinted native builder
        if: steps.builder.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ steps.profile.outputs.dockerfile }}
          platforms: linux/amd64
          target: reusable_builder_base
          push: true
          tags: ${{ steps.profile.outputs.builder_image }}
          build-args: |
            PIP_INDEX_URL=https://pypi.org/simple
            UV_DEFAULT_INDEX=https://pypi.org/simple
            USE_SCCACHE=true
            SCCACHE_GHA_ENABLED=on
            SCCACHE_GHA_VERSION=${{ steps.profile.outputs.sccache_cache_version }}
          secret-envs: |
            actions-results-url=ACTIONS_RESULTS_URL
            actions-runtime-token=ACTIONS_RUNTIME_TOKEN
            pip-index-url=PIP_INDEX_URL
            uv-default-index=UV_DEFAULT_INDEX
          provenance: false
          sbom: false

      - name: Render gateway runtime using the reusable native builder
        env:
          BUILDER_IMAGE: ${{ steps.profile.outputs.builder_image }}
        run: |
          python3 container/render.py --framework vllm --target runtime \
            --cuda-version 13.0 --platform linux/amd64 --builder-image "${BUILDER_IMAGE}"

      - name: Build and publish the gateway framework runtime
        id: framework
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ steps.profile.outputs.dockerfile }}
          platforms: linux/amd64
          target: runtime
          pull: true
          push: true
          tags: ${{ steps.profile.outputs.framework_image }}
          build-args: |
            PIP_INDEX_URL=https://pypi.org/simple
            UV_DEFAULT_INDEX=https://pypi.org/simple
            DYNAMO_COMMIT_SHA=${{ github.sha }}
            USE_SCCACHE=true
            SCCACHE_GHA_ENABLED=on
            SCCACHE_GHA_VERSION=${{ steps.profile.outputs.sccache_cache_version }}
          secret-envs: |
            actions-results-url=ACTIONS_RESULTS_URL
            actions-runtime-token=ACTIONS_RUNTIME_TOKEN
            pip-index-url=PIP_INDEX_URL
            uv-default-index=UV_DEFAULT_INDEX
          # Retain gateway's in-image compliance, avoid huge intermediate registry cache exports.
          provenance: false
          sbom: false

      - name: Bind the final stage to this run's real framework digest
        id: framework_record
        env:
          FRAMEWORK_DIGEST: ${{ steps.framework.outputs.digest }}
        run: |
          python3 .github/scripts/h3_experimental_ci.py record-framework \
            --digest "${FRAMEWORK_DIGEST}" --github-output "${GITHUB_OUTPUT}" \
            --directory .h3-experimental-evidence/ci
          cp container/vllm-runtime-cuda13.0-amd64-rendered.Dockerfile .h3-experimental-evidence/ci/framework.Dockerfile

      - name: Build the four-adapter Ref8 repair image and export CPU evidence
        uses: docker/build-push-action@v7
        with:
          context: container/h3-experimental
          file: container/h3-experimental/Dockerfile
          platforms: linux/amd64
          target: evidence
          pull: true
          push: false
          outputs: type=local,dest=.h3-experimental-evidence/final
          build-args: |
            BASE_IMAGE=${{ steps.framework_record.outputs.framework_ref }}
            H3_EXPERIMENTAL_SOURCE_COMMIT=${{ github.sha }}
          secret-envs: |
            pip-index-url=PIP_INDEX_URL
            uv-default-index=UV_DEFAULT_INDEX
          provenance: false
          sbom: false

      - name: Require final full-Omni, four-adapter and Ref8 offline reports
        env:
          FRAMEWORK_REF: ${{ steps.framework_record.outputs.framework_ref }}
        run: |
          python3 .github/scripts/h3_experimental_ci.py validate-evidence \
            --directory .h3-experimental-evidence/final --framework-ref "${FRAMEWORK_REF}"

      - name: Publish the verified experimental distilled runtime
        id: final
        uses: docker/build-push-action@v7
        with:
          context: container/h3-experimental
          file: container/h3-experimental/Dockerfile
          platforms: linux/amd64
          target: runtime
          pull: true
          push: true
          tags: ${{ steps.profile.outputs.final_image }}
          build-args: |
            BASE_IMAGE=${{ steps.framework_record.outputs.framework_ref }}
            H3_EXPERIMENTAL_SOURCE_COMMIT=${{ github.sha }}
          secret-envs: |
            pip-index-url=PIP_INDEX_URL
            uv-default-index=UV_DEFAULT_INDEX
          provenance: false
          sbom: false

      - name: Save the actual final digest and complete recipe evidence
        env:
          FINAL_DIGEST: ${{ steps.final.outputs.digest }}
          FRAMEWORK_REF: ${{ steps.framework_record.outputs.framework_ref }}
        run: |
          python3 .github/scripts/h3_experimental_ci.py record-final \
            --digest "${FINAL_DIGEST}" --framework-ref "${FRAMEWORK_REF}" \
            --directory .h3-experimental-evidence/final
          echo '### H3 experimental Omni 0.31 publication' >> "${GITHUB_STEP_SUMMARY}"
          cat .h3-experimental-evidence/final/deployment-image.txt >> "${GITHUB_STEP_SUMMARY}"
          echo 'Final CPU checks passed; H100, mounted Base identity, adapter activation and media E2E remain separate.' >> "${GITHUB_STEP_SUMMARY}"

      - name: Save source, framework and final evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h3-experimental-omni031-${{ github.sha }}-${{ github.run_attempt }}
          path: .h3-experimental-evidence/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  h3-seedvr2-rmsnorm:
    if: github.ref_name == 'Dingorouter-H3-vllm-omni-jirx' && github.event_name == 'workflow_dispatch' && inputs.build_recipe == 'seedvr2-rmsnorm'
    runs-on: [self-hosted, linux, x64, dingo]
    timeout-minutes: 120
    env:
      SR_EVIDENCE: .h3-experimental-evidence/srnorm/ci/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout the existing H3 experimental branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Verify sealed patch recipe and immutable parent
        id: profile
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker buildx version
          python3 .github/scripts/h3_seedvr2_rmsnorm_ci.py prepare \
            --directory "${SR_EVIDENCE}" --github-output "${GITHUB_OUTPUT}"

      - name: Log in to the existing Harbor repository
        uses: docker/login-action@v4
        with:
          registry: ${{ steps.profile.outputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Reuse the persistent group Docker builder
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - name: Pull only the successful immutable Harbor parent
        env:
          PARENT_IMAGE: ${{ steps.profile.outputs.parent_image }}
        shell: bash
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "${PARENT_IMAGE}"

      - name: Build and load the minimal offline repair candidate without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ steps.profile.outputs.dockerfile }}
          platforms: linux/amd64
          target: runtime
          pull: false
          push: false
          load: true
          tags: ${{ steps.profile.outputs.candidate_image }}
          build-args: |
            BASE_IMAGE=${{ steps.profile.outputs.parent_image }}
            H3_EXPERIMENTAL_SOURCE_COMMIT=${{ github.sha }}
          provenance: false
          sbom: false

      - name: Verify the loaded final image as UID1000 with networking disabled
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/h3_seedvr2_rmsnorm_ci.py verify-candidate \
            --directory "${SR_EVIDENCE}"

      - name: Publish the exact tested image then verify its immutable registry pull
        id: publication
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/h3_seedvr2_rmsnorm_ci.py publish \
            --directory "${SR_EVIDENCE}" --github-output "${GITHUB_OUTPUT}"
          echo '### SeedVR2 RMSNorm derivative publication' >> "${GITHUB_STEP_SUMMARY}"
          cat "${SR_EVIDENCE}/deployment-image.txt" >> "${GITHUB_STEP_SUMMARY}"
          echo 'CPU precision/import and retained capability gates passed; CUDA, fixed-input video and visual acceptance remain separate.' >> "${GITHUB_STEP_SUMMARY}"

      - name: Save fresh patch, final-image and inherited capability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-evidence-h3-seedvr2-rmsnorm-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.SR_EVIDENCE }}/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  omni-gateway-lite:
    if: github.ref_name == 'Dingorouter-H3-vllm-omni-jirx' && ((github.event_name == 'push' && !contains(github.event.head_commit.message, '[seedvr2-optimization]') && !contains(github.event.head_commit.message, '[sr-native]') && !contains(github.event.head_commit.message, '[seedvr2-c14]') && !contains(github.event.head_commit.message, '[h3-hsdp-offload]')) || (github.event_name == 'workflow_dispatch' && inputs.build_recipe == 'omni-gateway-lite'))
    runs-on: [self-hosted, linux, x64, dingo]
    timeout-minutes: 120
    env:
      LITE_EVIDENCE: .h3-experimental-evidence/lite/ci/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout the existing H3 branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Verify sealed lightweight inputs
        id: profile
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker buildx version
          python3 .github/scripts/omni_gateway_lite_ci.py prepare \
            --directory "${LITE_EVIDENCE}" --github-output "${GITHUB_OUTPUT}"

      - name: Log in to the existing Harbor
        uses: docker/login-action@v4
        with:
          registry: ${{ steps.profile.outputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Reuse the persistent group builder
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - name: Pull the immutable adapter-free framework parent
        shell: bash
        env:
          PARENT_IMAGE: ${{ steps.profile.outputs.parent_image }}
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "${PARENT_IMAGE}"

      - name: Build and load the offline candidate without publication
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ steps.profile.outputs.dockerfile }}
          platforms: linux/amd64
          target: runtime
          pull: false
          push: false
          load: true
          tags: ${{ steps.profile.outputs.candidate_image }}
          build-args: |
            BASE_IMAGE=${{ steps.profile.outputs.parent_image }}
            H3_EXPERIMENTAL_SOURCE_COMMIT=${{ github.sha }}
          provenance: false
          sbom: false

      - name: Verify actual final imports, precision, Gateway and full dependency closure
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/omni_gateway_lite_ci.py verify-candidate \
            --directory "${LITE_EVIDENCE}"

      - name: Publish the exact tested image and verify its immutable pull
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/omni_gateway_lite_ci.py publish \
            --directory "${LITE_EVIDENCE}" --github-output "${GITHUB_OUTPUT}"
          echo '### Omni031 Gateway Lite publication' >> "${GITHUB_STEP_SUMMARY}"
          cat "${LITE_EVIDENCE}/deployment-image.txt" >> "${GITHUB_STEP_SUMMARY}"
          echo 'CPU precision, installed source, media and dependency gates passed. GPU, Gateway service E2E and video quality remain separate.' >> "${GITHUB_STEP_SUMMARY}"

      - name: Save new evidence even when a gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-evidence-omni-gateway-lite-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.LITE_EVIDENCE }}/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  seedvr2-c14:
    if: github.ref_name == 'Dingorouter-H3-vllm-omni-jirx' && ((github.event_name == 'push' && !contains(github.event.head_commit.message, '[seedvr2-optimization]') && !contains(github.event.head_commit.message, '[sr-native]') && contains(github.event.head_commit.message, '[seedvr2-c14]') && !contains(github.event.head_commit.message, '[h3-hsdp-offload]')) || (github.event_name == 'workflow_dispatch' && inputs.build_recipe == 'seedvr2-c14'))
    runs-on: [self-hosted, linux, x64, dingo]
    timeout-minutes: 120
    env:
      C14_EVIDENCE: .h3-experimental-evidence/c14/ci/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout the existing H3 branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Verify sealed C14 diagnostic inputs
        id: profile
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker buildx version
          python3 .github/scripts/seedvr2_c14_ci.py prepare \
            --directory "${C14_EVIDENCE}" --github-output "${GITHUB_OUTPUT}"

      - name: Log in to the existing Harbor
        uses: docker/login-action@v4
        with:
          registry: ${{ steps.profile.outputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Reuse the persistent group builder
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - name: Pull the immutable published adapter-free Gateway lite parent
        shell: bash
        env:
          PARENT_IMAGE: ${{ steps.profile.outputs.parent_image }}
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "${PARENT_IMAGE}"

      - name: Build and load the offline candidate without publication
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ steps.profile.outputs.dockerfile }}
          platforms: linux/amd64
          target: runtime
          pull: false
          push: false
          load: true
          tags: ${{ steps.profile.outputs.candidate_image }}
          build-args: |
            BASE_IMAGE=${{ steps.profile.outputs.parent_image }}
            H3_C14_SOURCE_COMMIT=${{ github.sha }}
          provenance: false
          sbom: false

      - name: Verify actual final imports, precision, Gateway and full dependency closure
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/seedvr2_c14_ci.py verify-candidate \
            --directory "${C14_EVIDENCE}"

      - name: Publish the exact tested image and verify its immutable pull
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/seedvr2_c14_ci.py publish \
            --directory "${C14_EVIDENCE}" --github-output "${GITHUB_OUTPUT}"
          echo '### SeedVR2 C14 diagnostic publication' >> "${GITHUB_STEP_SUMMARY}"
          cat "${C14_EVIDENCE}/deployment-image.txt" >> "${GITHUB_STEP_SUMMARY}"
          echo 'CPU diagnostic, precision, source and dependency gates passed. C14 root cause, SP8 replay and quality remain unproven pending controlled GPU trials.' >> "${GITHUB_STEP_SUMMARY}"

      - name: Save new evidence even when a gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-evidence-seedvr2-c14-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.C14_EVIDENCE }}/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  h3-hsdp-offload:
    if: github.ref_name == 'Dingorouter-H3-vllm-omni-jirx' && ((github.event_name == 'push' && !contains(github.event.head_commit.message, '[seedvr2-optimization]') && !contains(github.event.head_commit.message, '[sr-native]') && contains(github.event.head_commit.message, '[h3-hsdp-offload]')) || (github.event_name == 'workflow_dispatch' && inputs.build_recipe == 'h3-hsdp-offload'))
    runs-on: [self-hosted, linux, x64, dingo]
    timeout-minutes: 120
    env:
      HSDP_EVIDENCE: .h3-experimental-evidence/hsdp/ci/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout the existing H3 branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Verify sealed HSDP offload candidate inputs
        id: profile
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker buildx version
          python3 .github/scripts/h3_hsdp_offload_ci.py prepare \
            --directory "${HSDP_EVIDENCE}" --github-output "${GITHUB_OUTPUT}"

      - name: Log in to the existing Harbor
        uses: docker/login-action@v4
        with:
          registry: ${{ steps.profile.outputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Reuse the persistent group builder
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - name: Pull and archive actual installed parent Omni and Torch sources
        shell: bash
        env:
          PARENT_IMAGE: ${{ steps.profile.outputs.parent_image }}
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "${PARENT_IMAGE}"
          python3 .github/scripts/h3_hsdp_offload_ci.py snapshot-parent \
            --directory "${HSDP_EVIDENCE}"

      - name: Build and load the offline candidate without publication
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ steps.profile.outputs.dockerfile }}
          platforms: linux/amd64
          target: runtime
          pull: false
          push: false
          load: true
          tags: ${{ steps.profile.outputs.candidate_image }}
          build-args: |
            BASE_IMAGE=${{ steps.profile.outputs.parent_image }}
            H3_HSDP_SOURCE_COMMIT=${{ github.sha }}
          provenance: false
          sbom: false

      - name: Verify actual final source, inherited dependencies and CPU regression evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/h3_hsdp_offload_ci.py verify-candidate \
            --directory "${HSDP_EVIDENCE}"

      - name: Publish the exact tested image and verify its immutable pull
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/h3_hsdp_offload_ci.py publish \
            --directory "${HSDP_EVIDENCE}" --github-output "${GITHUB_OUTPUT}"
          echo '### HSDP offload CPU candidate publication' >> "${GITHUB_STEP_SUMMARY}"
          cat "${HSDP_EVIDENCE}/deployment-image.txt" >> "${GITHUB_STEP_SUMMARY}"
          echo 'CPU candidate only: GPU_NOT_RUN. Actual HSDP CUDA migration and eight-GPU C02 cold/warm/repeated media acceptance must pass before Ref7 or deployment promotion.' >> "${GITHUB_STEP_SUMMARY}"

      - name: Save new evidence even when a gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-evidence-h3-hsdp-offload-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.HSDP_EVIDENCE }}/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  seedvr2-optimization:
    if: github.ref_name == 'Dingorouter-H3-vllm-omni-jirx' && ((github.event_name == 'push' && contains(github.event.head_commit.message, '[seedvr2-optimization]')) || (github.event_name == 'workflow_dispatch' && inputs.build_recipe == 'seedvr2-optimization'))
    runs-on: [self-hosted, linux, x64, dingo]
    timeout-minutes: 120
    env:
      SR_OPT_EVIDENCE: .h3-experimental-evidence/seedvr2-optimization/ci/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout the existing H3 branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Verify sealed SeedVR2 optimization inputs
        id: profile
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker buildx version
          python3 .github/scripts/seedvr2_optimization_ci.py prepare \
            --directory "${SR_OPT_EVIDENCE}" --github-output "${GITHUB_OUTPUT}"

      - name: Log in to the existing Harbor
        uses: docker/login-action@v4
        with:
          registry: ${{ steps.profile.outputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Reuse the persistent group builder
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - name: Pull and verify actual installed parent repair sources
        shell: bash
        env:
          PARENT_IMAGE: ${{ steps.profile.outputs.parent_image }}
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "${PARENT_IMAGE}"
          python3 .github/scripts/seedvr2_optimization_ci.py snapshot-parent \
            --directory "${SR_OPT_EVIDENCE}"

      - name: Build and load the offline candidate without publication
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ steps.profile.outputs.dockerfile }}
          platforms: linux/amd64
          target: runtime
          pull: false
          push: false
          load: true
          tags: ${{ steps.profile.outputs.candidate_image }}
          build-args: |
            BASE_IMAGE=${{ steps.profile.outputs.parent_image }}
            SEEDVR2_OPT_SOURCE_COMMIT=${{ github.sha }}
          provenance: false
          sbom: false

      - name: Verify actual final source, inherited dependencies and CPU regression evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/seedvr2_optimization_ci.py verify-candidate \
            --directory "${SR_OPT_EVIDENCE}"

      - name: Publish the exact tested image and verify its immutable pull
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/seedvr2_optimization_ci.py publish \
            --directory "${SR_OPT_EVIDENCE}" --github-output "${GITHUB_OUTPUT}"
          echo '### SeedVR2 optimization CPU candidate publication' >> "${GITHUB_STEP_SUMMARY}"
          cat "${SR_OPT_EVIDENCE}/deployment-image.txt" >> "${GITHUB_STEP_SUMMARY}"
          echo 'CPU candidate only: GPU_NOT_RUN. Eight-rank timing, off/basic perturbation, window capacity, same-source legacy/single media and human quality acceptance remain separate gates.' >> "${GITHUB_STEP_SUMMARY}"

      - name: Save new evidence even when a gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-evidence-seedvr2-optimization-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.SR_OPT_EVIDENCE }}/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  sr-native:
    if: github.ref_name == 'Dingorouter-H3-vllm-omni-jirx' && ((github.event_name == 'push' && !contains(github.event.head_commit.message, '[seedvr2-optimization]') && contains(github.event.head_commit.message, '[sr-native]')) || (github.event_name == 'workflow_dispatch' && inputs.build_recipe == 'sr-native'))
    name: Native SR reference - ${{ matrix.backend }} - GPU_NOT_RUN
    runs-on: [self-hosted, linux, x64, dingo]
    timeout-minutes: 360
    strategy:
      fail-fast: false
      # Both stacks compile CUDA extensions. Serialize to limit shared runner RAM/disk pressure.
      max-parallel: 1
      matrix:
        backend: [seedvr2, flashvsr-plus]
    env:
      NATIVE_BACKEND: ${{ matrix.backend }}
      NATIVE_EVIDENCE: .h3-experimental-evidence/sr-native/ci/${{ github.run_id }}-${{ github.run_attempt }}/${{ matrix.backend }}
    steps:
      - name: Checkout the existing experiment branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Verify the sealed independent native recipe
        id: profile
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker buildx version
          python3 -B -m unittest discover -s .github/scripts -p test_sr_native_ci.py
          python3 .github/scripts/sr_native_ci.py prepare --backend "${NATIVE_BACKEND}" \
            --directory "${NATIVE_EVIDENCE}" --github-output "${GITHUB_OUTPUT}"

      - name: Log in to the existing Harbor repository
        uses: docker/login-action@v4
        with:
          registry: ${{ steps.profile.outputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Reuse the persistent Docker builder
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - name: Pull the reviewed immutable CUDA base with bounded retries
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/sr_native_ci.py pull-base --backend "${NATIVE_BACKEND}" \
            --directory "${NATIVE_EVIDENCE}"

      - name: Build and load the native candidate without publication
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ steps.profile.outputs.dockerfile }}
          platforms: linux/amd64
          target: runtime
          pull: false
          push: false
          load: true
          tags: ${{ steps.profile.outputs.candidate_image }}
          build-args: |
            BASE_IMAGE=${{ steps.profile.outputs.base_image }}
            DYNAMO_COMMIT_SHA=${{ github.sha }}
          provenance: false
          sbom: false

      - name: Verify nonroot offline imports, dependencies and package evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/sr_native_ci.py verify-candidate --backend "${NATIVE_BACKEND}" \
            --directory "${NATIVE_EVIDENCE}"

      - name: Publish exactly the CPU-validated candidate and verify immutable pull
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/sr_native_ci.py publish --backend "${NATIVE_BACKEND}" \
            --directory "${NATIVE_EVIDENCE}" --github-output "${GITHUB_OUTPUT}"
          echo "### Native SR ${NATIVE_BACKEND}: CPU candidate, GPU_NOT_RUN" >> "${GITHUB_STEP_SUMMARY}"
          cat "${NATIVE_EVIDENCE}/deployment-image.txt" >> "${GITHUB_STEP_SUMMARY}"
          echo 'Weight identity, CUDA kernels, complete 17-frame inference and media/quality acceptance remain separate. This is not a Gateway image.' >> "${GITHUB_STEP_SUMMARY}"

      - name: Preserve native source, dependency and publication evidence on failure too
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-evidence-sr-native-${{ matrix.backend }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.NATIVE_EVIDENCE }}/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
