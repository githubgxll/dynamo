name: Dingo runtime images

on:
  push:
    branches:
      - 'DingoRouter-*'
  workflow_dispatch:
    inputs:
      frameworks:
        description: Images to build (configured uses dingo-images.json)
        type: choice
        options:
          - configured
          - dynamo
          - vllm
          - sglang
          - all
        default: configured

permissions:
  contents: read

# Preserve an image for every pushed commit while preventing two workflow runs
# from competing for the same local Docker daemon.
concurrency:
  group: dingo-runtime-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare image matrix
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    outputs:
      has_images: ${{ steps.matrix.outputs.has_images }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Read and validate image configuration
        id: matrix
        env:
          FRAMEWORK_SELECTION: ${{ inputs.frameworks || 'configured' }}
        run: |
          python3 .github/scripts/prepare_dingo_image_matrix.py \
            --config .github/dingo-images.json \
            --github-sha "${GITHUB_SHA}" \
            --selection "${FRAMEWORK_SELECTION}" \
            --github-output "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.framework }} ${{ matrix.render_target }}
    needs: prepare
    if: needs.prepare.outputs.has_images == 'true'
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Check self-hosted runner prerequisites
        shell: bash
        run: |
          docker version
          docker buildx version
          python3 -c "import jinja2, yaml"

      - name: Log in to the private registry
        uses: docker/login-action@v4
        with:
          registry: ${{ matrix.registry }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # Use the persistent self-hosted runner's Docker daemon instead of
          # creating a disposable BuildKit container for every job. Downloaded
          # builder-image layers remain in the host content store across runs;
          # the published builder image remains the fallback for another runner.
          driver: docker

      - name: Configure GitHub Actions cache for sccache
        uses: actions/github-script@v7
        with:
          # sccache's GHA backend needs the job-scoped cache service URL and
          # runtime token. Export them for the following BuildKit invocation;
          # the build passes them as secrets rather than image build arguments.
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '')
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '')

      - name: Check reusable builder image
        if: matrix.builder_image != ''
        id: builder
        shell: bash
        env:
          BUILDER_IMAGE: ${{ matrix.builder_image }}
        run: |
          if docker buildx imagetools inspect "${BUILDER_IMAGE}" >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "Reusing ${BUILDER_IMAGE}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
            echo "Builder image is missing; it will be built once: ${BUILDER_IMAGE}"
          fi

      - name: Render ${{ matrix.framework }} builder Dockerfile
        if: matrix.builder_image != '' && steps.builder.outputs.exists != 'true'
        shell: bash
        env:
          CUDA_VERSION: ${{ matrix.cuda_version }}
          FRAMEWORK: ${{ matrix.framework }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          python3 container/render.py \
            --framework "${FRAMEWORK}" \
            --target runtime \
            --cuda-version "${CUDA_VERSION}" \
            --platform "${PLATFORM}"

      - name: Build and publish reusable builder image
        if: matrix.builder_image != '' && steps.builder.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          target: reusable_builder_base
          push: true
          tags: ${{ matrix.builder_image }}
          build-args: |
            USE_SCCACHE=true
            SCCACHE_GHA_ENABLED=on
            SCCACHE_GHA_VERSION=${{ matrix.sccache_cache_version }}
          secret-envs: |
            actions-results-url=ACTIONS_RESULTS_URL
            actions-runtime-token=ACTIONS_RUNTIME_TOKEN
          provenance: false
          sbom: false

      - name: Render ${{ matrix.framework }} ${{ matrix.render_target }} Dockerfile
        shell: bash
        env:
          BUILDER_IMAGE: ${{ matrix.builder_image }}
          CUDA_VERSION: ${{ matrix.cuda_version }}
          FRAMEWORK: ${{ matrix.framework }}
          PLATFORM: ${{ matrix.platform }}
          RENDER_TARGET: ${{ matrix.render_target }}
        run: |
          python3 container/render.py \
            --framework "${FRAMEWORK}" \
            --target "${RENDER_TARGET}" \
            --cuda-version "${CUDA_VERSION}" \
            --platform "${PLATFORM}" \
            --builder-image "${BUILDER_IMAGE}"

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          target: ${{ matrix.docker_target }}
          pull: true
          push: true
          tags: ${{ matrix.image }}
          build-args: |
            USE_SCCACHE=true
            SCCACHE_GHA_ENABLED=on
            SCCACHE_GHA_VERSION=${{ matrix.sccache_cache_version }}
          secret-envs: |
            actions-results-url=ACTIONS_RESULTS_URL
            actions-runtime-token=ACTIONS_RUNTIME_TOKEN
          # Native dependencies come from the immutable builder image above.
          # Do not export mode=max here: it republishes every intermediate layer
          # on every code build and is too large for the private registry link.
          provenance: false
          sbom: false

      - name: Publish job summary
        env:
          BUILDER_IMAGE: ${{ matrix.builder_image }}
          IMAGE: ${{ matrix.image }}
        run: |
          echo "### Published image" >> "${GITHUB_STEP_SUMMARY}"
          echo "\`${IMAGE}\`" >> "${GITHUB_STEP_SUMMARY}"
          if [ -n "${BUILDER_IMAGE}" ]; then
            echo "" >> "${GITHUB_STEP_SUMMARY}"
            echo "### Reusable builder image" >> "${GITHUB_STEP_SUMMARY}"
            echo "\`${BUILDER_IMAGE}\`" >> "${GITHUB_STEP_SUMMARY}"
          fi
