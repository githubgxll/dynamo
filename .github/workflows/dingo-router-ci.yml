name: Dingo runtime images

on:
  push:
    branches:
      - 'DingoRouter-*'
  workflow_dispatch:
    inputs:
      frameworks:
        description: Images to build (configured uses dingo-images.json)
        type: choice
        options:
          - configured
          - dynamo
          - vllm
          - sglang
          - vbench
          - all
        default: configured

permissions:
  contents: read

# Preserve an image for every pushed commit while preventing two workflow runs
# from competing for the same local Docker daemon.
concurrency:
  group: dingo-runtime-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare image matrix
    runs-on: [self-hosted, linux, x64, dingo]
    timeout-minutes: 10
    outputs:
      has_images: ${{ steps.matrix.outputs.has_images }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Read and validate image configuration
        id: matrix
        env:
          FRAMEWORK_SELECTION: ${{ inputs.frameworks || 'configured' }}
        run: |
          python3 .github/scripts/prepare_dingo_image_matrix.py \
            --config .github/dingo-images.json \
            --github-sha "${GITHUB_SHA}" \
            --selection "${FRAMEWORK_SELECTION}" \
            --github-output "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.framework }} ${{ matrix.render_target }}
    needs: prepare
    if: needs.prepare.outputs.has_images == 'true'
    runs-on: [self-hosted, linux, x64, dingo]
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Check self-hosted runner prerequisites
        shell: bash
        run: |
          docker version
          docker buildx version
          python3 -c "import jinja2, yaml"

      - name: Log in to the private registry
        if: matrix.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ matrix.registry }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # Use the persistent self-hosted runner's Docker daemon instead of
          # creating a disposable BuildKit container for every job. Downloaded
          # builder-image layers remain in the host content store across runs;
          # the published builder image remains the fallback for another runner.
          driver: docker

      - name: Configure GitHub Actions cache for sccache
        if: matrix.framework != 'vbench'
        uses: actions/github-script@v7
        with:
          # sccache's GHA backend needs the job-scoped cache service URL and
          # runtime token. Export them for the following BuildKit invocation;
          # the build passes them as secrets rather than image build arguments.
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '')
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '')

      - name: Check reusable builder image
        if: matrix.builder_image != ''
        id: builder
        shell: bash
        env:
          BUILDER_IMAGE: ${{ matrix.builder_image }}
        run: |
          if docker buildx imagetools inspect "${BUILDER_IMAGE}" >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "Reusing ${BUILDER_IMAGE}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
            echo "Builder image is missing; it will be built once: ${BUILDER_IMAGE}"
          fi

      - name: Render ${{ matrix.framework }} builder Dockerfile
        if: matrix.builder_image != '' && steps.builder.outputs.exists != 'true'
        shell: bash
        env:
          CUDA_VERSION: ${{ matrix.cuda_version }}
          FRAMEWORK: ${{ matrix.framework }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          python3 container/render.py \
            --framework "${FRAMEWORK}" \
            --target runtime \
            --cuda-version "${CUDA_VERSION}" \
            --platform "${PLATFORM}"

      - name: Build and publish reusable builder image
        if: matrix.builder_image != '' && steps.builder.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          target: reusable_builder_base
          push: true
          tags: ${{ matrix.builder_image }}
          build-args: |
            PIP_INDEX_URL=${{ matrix.framework == 'sglang' && 'https://pypi.tuna.tsinghua.edu.cn/simple' || 'https://pypi.org/simple' }}
            UV_DEFAULT_INDEX=${{ matrix.framework == 'sglang' && 'https://pypi.tuna.tsinghua.edu.cn/simple' || 'https://pypi.org/simple' }}
            USE_SCCACHE=true
            SCCACHE_GHA_ENABLED=on
            SCCACHE_GHA_VERSION=${{ matrix.sccache_cache_version }}
          secret-envs: |
            actions-results-url=ACTIONS_RESULTS_URL
            actions-runtime-token=ACTIONS_RUNTIME_TOKEN
          provenance: false
          sbom: false

      - name: Render ${{ matrix.framework }} ${{ matrix.render_target }} Dockerfile
        if: matrix.framework != 'vbench'
        shell: bash
        env:
          BUILDER_IMAGE: ${{ matrix.builder_image }}
          CUDA_VERSION: ${{ matrix.cuda_version }}
          FRAMEWORK: ${{ matrix.framework }}
          PLATFORM: ${{ matrix.platform }}
          RENDER_TARGET: ${{ matrix.render_target }}
        run: |
          python3 container/render.py \
            --framework "${FRAMEWORK}" \
            --target "${RENDER_TARGET}" \
            --cuda-version "${CUDA_VERSION}" \
            --platform "${PLATFORM}" \
            --builder-image "${BUILDER_IMAGE}"

      - name: Build and push ${{ matrix.image }}
        if: matrix.framework != 'vbench'
        id: runtime_image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          target: ${{ matrix.docker_target }}
          pull: true
          push: true
          tags: ${{ matrix.image }}
          build-args: |
            PIP_INDEX_URL=${{ matrix.framework == 'sglang' && 'https://pypi.tuna.tsinghua.edu.cn/simple' || 'https://pypi.org/simple' }}
            UV_DEFAULT_INDEX=${{ matrix.framework == 'sglang' && 'https://pypi.tuna.tsinghua.edu.cn/simple' || 'https://pypi.org/simple' }}
            DYNAMO_COMMIT_SHA=${{ github.sha }}
            USE_SCCACHE=true
            SCCACHE_GHA_ENABLED=on
            SCCACHE_GHA_VERSION=${{ matrix.sccache_cache_version }}
          secret-envs: |
            actions-results-url=ACTIONS_RESULTS_URL
            actions-runtime-token=ACTIONS_RUNTIME_TOKEN
          # Native dependencies come from the immutable builder image above.
          # Do not export mode=max here: it republishes every intermediate layer
          # on every code build and is too large for the private registry link.
          provenance: false
          sbom: false

      # VBench uses a static Dockerfile, its own CUDA base, and no native
      # Dynamo builder or GPU. Preparation exports evidence but never pushes.
      - name: Resolve VBench preparation base image
        if: matrix.framework == 'vbench' && matrix.vbench_phase == 'prepare'
        id: vbench_prepare_base
        shell: bash
        run: |
          python3 .github/scripts/vbench_ci.py resolve-base \
            --lock .vbench-base/base.lock.json \
            --github-output "${GITHUB_OUTPUT}"

      - name: Validate reviewed VBench publish locks
        if: matrix.framework == 'vbench' && matrix.vbench_phase == 'publish'
        id: vbench_publish_base
        shell: bash
        run: |
          python3 .github/scripts/vbench_ci.py verify-locks \
            --directory container/vbench/locks \
            --github-output "${GITHUB_OUTPUT}"

      - name: Check and pull locked VBench base with Docker daemon
        if: matrix.framework == 'vbench'
        id: vbench_base_pull
        shell: bash
        timeout-minutes: 35
        env:
          VBENCH_PHASE: ${{ matrix.vbench_phase }}
        run: |
          if [ "${VBENCH_PHASE}" = prepare ]; then
            lock=.vbench-base/base.lock.json
          else
            lock=container/vbench/locks/base.lock.json
          fi
          python3 .github/scripts/vbench_ci.py pull-base \
            --lock "${lock}" --evidence .vbench-base/pull-evidence

      - name: Prepare VBench dependency and asset evidence (no push)
        if: matrix.framework == 'vbench' && matrix.vbench_phase == 'prepare'
        id: vbench_prepare
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          target: preparation_artifact
          # The exact digest was pulled and checked with this Docker daemon.
          # Allow its local content; false does not guarantee zero registry access.
          pull: false
          push: false
          outputs: type=local,dest=.vbench-preparation
          build-args: |
            BASE_IMAGE=${{ steps.vbench_prepare_base.outputs.base_image }}
            VBENCH_PHASE=prepare
            DYNAMO_COMMIT_SHA=${{ github.sha }}
          provenance: false
          sbom: false

      - name: Build and publish reviewed VBench image
        if: matrix.framework == 'vbench' && matrix.vbench_phase == 'publish'
        id: vbench_image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          target: runtime
          pull: false
          push: true
          tags: ${{ matrix.image }}
          build-args: |
            BASE_IMAGE=${{ steps.vbench_publish_base.outputs.base_image }}
            VBENCH_PHASE=publish
            DYNAMO_COMMIT_SHA=${{ github.sha }}
          provenance: false
          sbom: false

      - name: Record published image digest
        if: matrix.publish == 'true' && (steps.runtime_image.outputs.digest != '' || steps.vbench_image.outputs.digest != '')
        shell: bash
        env:
          BUILDER_IMAGE: ${{ matrix.builder_image }}
          IMAGE: ${{ matrix.image }}
          IMAGE_DIGEST: ${{ steps.vbench_image.outputs.digest || steps.runtime_image.outputs.digest }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          python3 .github/scripts/vbench_ci.py record-image \
            --image "${IMAGE}" --digest "${IMAGE_DIGEST}" \
            --source-commit "${GITHUB_SHA}" --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" --builder-image "${BUILDER_IMAGE}" \
            --dockerfile "${DOCKERFILE}" --output .dingo-build-evidence/image.json \
            --summary "${GITHUB_STEP_SUMMARY}"
          cp "${DOCKERFILE}" .github/dingo-images.json .dingo-build-evidence/

      - name: Export VBench runtime audit and license evidence
        if: matrix.framework == 'vbench' && steps.vbench_image.outputs.digest != ''
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          target: image_evidence_artifact
          push: false
          outputs: type=local,dest=.vbench-image-evidence
          build-args: |
            BASE_IMAGE=${{ steps.vbench_publish_base.outputs.base_image }}
            VBENCH_PHASE=publish
            DYNAMO_COMMIT_SHA=${{ github.sha }}
          provenance: false
          sbom: false

      - name: Collect available VBench preparation evidence
        if: always() && matrix.framework == 'vbench'
        shell: bash
        env:
          PREPARE_OUTCOME: ${{ steps.vbench_prepare.outcome }}
          PUBLISH_OUTCOME: ${{ steps.vbench_image.outcome }}
          BASE_PULL_OUTCOME: ${{ steps.vbench_base_pull.outcome }}
          VBENCH_PHASE: ${{ matrix.vbench_phase }}
        run: |
          mkdir -p .vbench-preparation
          if [ -f .vbench-base/base.lock.json ]; then
            cp .vbench-base/base.lock.json .vbench-preparation/base.lock.json
          fi
          if [ -d .vbench-base/pull-evidence ]; then
            cp -R .vbench-base/pull-evidence .vbench-preparation/base-pull
          fi
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = {key: os.environ.get(key, '') for key in (
              'GITHUB_SHA', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT',
              'VBENCH_PHASE', 'BASE_PULL_OUTCOME', 'PREPARE_OUTCOME', 'PUBLISH_OUTCOME')}
          Path('.vbench-preparation/workflow-status.json').write_text(json.dumps(data, indent=2) + '\n')
          PY
          if [ "${VBENCH_PHASE}" = prepare ]; then
            echo '### VBench preparation only' >> "${GITHUB_STEP_SUMMARY}"
            echo 'No Harbor image was published. Download and review the preparation artifact before switching vbench.phase to publish.' >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload VBench preparation and audit evidence
        if: always() && matrix.framework == 'vbench'
        uses: actions/upload-artifact@v4
        with:
          name: vbench-${{ matrix.vbench_phase }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .vbench-preparation/
            .vbench-image-evidence/
          include-hidden-files: true
          if-no-files-found: warn

      - name: Upload image evidence
        if: always() && matrix.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: image-evidence-${{ matrix.framework }}-${{ matrix.docker_target }}-${{ github.sha }}-${{ github.run_attempt }}
          path: .dingo-build-evidence/
          include-hidden-files: true
          if-no-files-found: warn
