name: H3 SR Video Gateway common runtime
run-name: "h3-sr-video-gateway | ${{ github.ref_name }} | ${{ github.sha }} | attempt ${{ github.run_attempt }}"

on:
  push:
    branches: [Dingorouter-H3-vllm-omni-jirx]

permissions:
  contents: read

concurrency:
  group: h3-sr-video-gateway-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reviewed-image:
    if: (github.event_name == 'push' && github.ref_name == 'Dingorouter-H3-vllm-omni-jirx' && contains(github.event.head_commit.message, '[h3-sr-video-gateway]')) && !contains(github.event.head_commit.message, '[seedvr2-bf16]')
    runs-on: [self-hosted, linux, x64, dingo]
    timeout-minutes: 120
    env:
      EVIDENCE: .h3-experimental-evidence/h3-sr-video-gateway/ci/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout the reviewed immutable production source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Log in with the existing controlled Harbor credentials
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: registry.hd-04.alayanew.com:8443
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Verify reviews, frozen inputs and existing publication state
        id: recipe
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/h3_sr_video_gateway_ci.py prepare --directory "${EVIDENCE}" --github-output "${GITHUB_OUTPUT}"

      - name: Reuse the persistent group builder
        if: steps.recipe.outputs.build_required == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver: docker

      - name: Build the single final common image without publication
        if: steps.recipe.outputs.build_required == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: container/h3-sr-production/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.recipe.outputs.image }}
          build-args: |
            BASE_IMAGE=${{ steps.recipe.outputs.base_image }}
            H3_SR_PRODUCTION_SOURCE_COMMIT=${{ github.sha }}
          provenance: false
          sbom: false

      - name: Validate the exact imageID offline as UID1000
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/h3_sr_video_gateway_ci.py validate --directory "${EVIDENCE}"

      - name: Publish or reuse the validated exact image and verify its digest pull
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/h3_sr_video_gateway_ci.py publish --directory "${EVIDENCE}"

      - name: Record actual Harbor state even after a failed step
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/h3_sr_video_gateway_ci.py outcome --directory "${EVIDENCE}"

      - name: Preserve publication and failure evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: h3-sr-video-gateway-${{ github.sha }}-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: ${{ env.EVIDENCE }}
          if-no-files-found: warn
          retention-days: 30
