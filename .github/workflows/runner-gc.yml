name: Dingo runner garbage collection (manual)

# The daily 05:00 Asia/Shanghai schedule is deployed with the runner from
# DingoRouter-base. This optional UI entry point is not needed for scheduling.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply cleanup (otherwise preview only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dingo-gxl-runner-gc
  cancel-in-progress: false

jobs:
  gc:
    runs-on: [self-hosted, linux, x64, dingo, gxl]
    timeout-minutes: 45
    env:
      GC_APPLY: ${{ inputs.apply == true }}
    steps:
      - name: Run the deployed and coordinated GC
        shell: bash
        run: |
          set -euxo pipefail
          test "${RUNNER_NAME}" = "dingo-gxl-runner"
          test -r /etc/dingo-gc/manager.py
          args=()
          if [[ "${GC_APPLY}" == true ]]; then args+=(--apply); fi
          python3 /etc/dingo-gc/manager.py manual "${args[@]}"
